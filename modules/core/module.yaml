name: core
version: 0.1.0
kind: core
description: >-
  Mandatory universal module. Provides the artifact chain, core skills, templates,
  and base schemas every Morpheus-scaffolded project inherits.
requires: []
incompatible_with: []
contributes:
  skills:
    - .agents/skills/spec-author/SKILL.md
    - .agents/skills/planner/SKILL.md
    - .agents/skills/decomposer/SKILL.md
    - .agents/skills/initializer/SKILL.md
    - .agents/skills/reviewer/SKILL.md
    - .agents/skills/integrator/SKILL.md
    - .agents/skills/fixer/SKILL.md
    - .agents/skills/evaluator/SKILL.md
    - .agents/skills/constitution-author/SKILL.md
    - .agents/skills/lore-reader/SKILL.md
    - .agents/skills/lore-curator/SKILL.md
    - .agents/skills/kill-switch/SKILL.md
    - .agents/skills/decommission/SKILL.md
    - .agents/skills/morpheus-orchestrator/SKILL.md
  templates:
    - templates/constitution.md.tmpl
    - templates/CLAUDE.md.tmpl
    - templates/AGENTS.md.tmpl
    - templates/copilot-instructions.md.tmpl
    - templates/feature-template/prd.md.tmpl
    - templates/feature-template/spec.md.tmpl
    - templates/feature-template/plan.md.tmpl
    - templates/feature-template/tasks.json.tmpl
    - templates/value-card.md.tmpl
  schemas:
    - schemas/platform-manifest.schema.json
    - schemas/module.schema.json
    - schemas/profile.schema.json
    - schemas/tasks.schema.json
    - schemas/overlap-map.schema.json
    - schemas/amendment.schema.json
    - schemas/adr.schema.json
    - schemas/value-card.schema.json
    - schemas/memory.schema.json
    - schemas/ontology.schema.json
    - schemas/template.schema.json
  workflows:
    - workflows/morpheus-constitution-check.yml.tmpl
  hooks: []
prompts:
  - name: project_name
    question: "Project name"
    required: true
  - name: primary_owner_email
    question: "Primary owner email (for CODEOWNERS and manifest)"
    required: true
detection:
  file_markers: []
