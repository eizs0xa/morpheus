name: workspace-companion
version: 0.1.0
description: >-
  Chat-orchestrated repo-first workspace setup. Creates a VS Code workspace with
  Morpheus and product repos as workspace folders, project config, env examples,
  START_HERE guidance, and local incubation folders.
requires:
  - name: core
    version_range: ">=0.1.0 <1.0.0"
incompatible_with: []
contributes:
  skills:
    - .agents/skills/chat-setup/SKILL.md
  workflows: []
  templates:
    - templates/project.code-workspace.tmpl
    - templates/project.config.json.tmpl
    - templates/START_HERE.md.tmpl
    - templates/env.example.tmpl
    - templates/morpheus-local.gitignore.tmpl
  hooks: []
  schemas: []
  instructions: []
prompts:
  - name: setup_preset
    question: "Setup preset"
    default: "daaa-standard"
    choices:
      - daaa-standard
      - daaa-regulated
      - discovery-only
      - custom
detection:
  file_markers:
    - .code-workspace